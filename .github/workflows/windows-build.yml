name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne ('v' + $version)) { throw 'Tag does not match package.json version' }
          if (!(Test-Path -LiteralPath ('docs/releases/' + $version + '.md'))) { throw 'Release notes are missing' }
      - name: Restore pinned image codecs
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test without personal configuration
        run: npm test
      - name: Build complete Windows bundle
        shell: powershell
        run: .\build-release.ps1
      - name: Upload Windows ZIP and checksum
        uses: actions/upload-artifact@v7
        with:
          name: PhoneNotify-win-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Download verified build from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name PhoneNotify-win-x64 --dir dist
      - name: Upload, verify and publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node publish-release.cjs
